services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ats_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASS}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  minio:
    image: minio/minio:latest
    container_name: ats_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ats_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  sqlserver_data:
  minio_data:
  qdrant_data:
