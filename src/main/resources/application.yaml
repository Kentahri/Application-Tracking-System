spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto:  create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

file:
  cv:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
    base-path: cvs
    create-bucket: true
    presign-expiry: 15m
    timeouts:
      connect: 5s
      read: 30s
      write: 30s
      call: 60s

gemini:
  api-key: ${GEMINI_API_KEY}
  embedding-model: ${GEMINI_EMBEDDING_MODEL}
  embedding-dimension: ${GEMINI_EMBEDDING_DIMENSION}
  chat-model: ${GEMINI_CHAT_MODEL}

qdrant:
  url: ${QDRANT_URL}
  collection: ${QDRANT_COLLECTION}
  vector-size: ${QDRANT_VECTOR_SIZE}
